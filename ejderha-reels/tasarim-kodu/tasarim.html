<script>
const yukle = (s) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = s; });
const tuval = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

function yuvarlakDikdortgen(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function percin(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, "#f4f6f8"); g.addColorStop(0.5, "#a9afb5"); g.addColorStop(1, "#3d4248");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}


// Ekranı net çiz: site görüntüsünü adım adım küçült (tek seferde küçültmek yazıları bulandırır),
// bulanıklık / sis / ışık katmanlarının ÜSTÜNE en son çizilir.
function netEkran(ctx, site, kirp, e) {
  let c = tuval(kirp[2], kirp[3]); c.getContext("2d").drawImage(site, kirp[0], kirp[1], kirp[2], kirp[3], 0, 0, kirp[2], kirp[3]);
  while (c.width / 2 > e.sw * 1.5) { const k = tuval(Math.round(c.width / 2), Math.round(c.height / 2)), g = k.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(c, 0, 0, k.width, k.height); c = k; }
  ctx.save(); ctx.imageSmoothingQuality = "high"; ctx.beginPath(); ctx.rect(e.sx, e.sy, e.sw, e.sh); ctx.clip();
  ctx.drawImage(c, e.sx, e.sy, e.sw, e.sh);
  const g = ctx.createLinearGradient(e.sx, e.sy, e.sx + e.sw * 0.7, e.sy + e.sh);
  g.addColorStop(0, "rgba(255,255,255,0.05)"); g.addColorStop(0.45, "rgba(255,255,255,0.015)"); g.addColorStop(0.46, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(e.sx, e.sy, e.sw, e.sh); ctx.restore();
  ctx.lineWidth = Math.max(1, e.sw / 240); ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.strokeRect(e.sx, e.sy, e.sw, e.sh);
}

// ---------- ORTA ÇAĞ LAPTOP (önden) ----------
// x,y: kapak dış kutusunun sol üstü; w: kapak genişliği. Ekran şövalyeye değil kameraya bakar.
function laptop(ctx, L) {
  const { x, y, w, site, kirp, derinlik, tasma } = L;
  const s = w / 500, h = w * 0.64;
  // menteşe kayışları (kapağın arkasından deck'e iner)
  // kapak
  yuvarlakDikdortgen(ctx, x, y, w, h, 9 * s);
  let g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#41464c"); g.addColorStop(0.5, "#26292e"); g.addColorStop(1, "#1a1c20");
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 4 * s; ctx.strokeStyle = "#c3c8cd"; ctx.stroke();
  ctx.lineWidth = 1.2 * s; ctx.strokeStyle = "rgba(20,22,25,0.9)";
  yuvarlakDikdortgen(ctx, x + 4 * s, y + 4 * s, w - 8 * s, h - 8 * s, 7 * s); ctx.stroke();
  // ekran
  const sx = x + 16 * s, sy = y + 16 * s, sw = w - 32 * s, sh = h - 42 * s;
  ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
  ctx.drawImage(site, kirp[0], kirp[1], kirp[2], kirp[3], sx, sy, sw, sh);
  g = ctx.createLinearGradient(sx, sy, sx + sw * 0.7, sy + sh);
  g.addColorStop(0, "rgba(255,255,255,0.10)"); g.addColorStop(0.45, "rgba(255,255,255,0.03)"); g.addColorStop(0.46, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(sx, sy, sw, sh);
  ctx.restore();
  ctx.lineWidth = 2 * s; ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.strokeRect(sx, sy, sw, sh);
  // köşe zırh başlıkları + perçinler
  const k = 40 * s, kk = 11 * s;
  for (const [cx, cy, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx + dx * k, cy); ctx.lineTo(cx + dx * k, cy + dy * kk * 0.6);
    ctx.quadraticCurveTo(cx + dx * kk * 1.4, cy + dy * kk, cx + dx * kk, cy + dy * kk * 1.4);
    ctx.lineTo(cx + dx * kk * 0.6, cy + dy * k); ctx.lineTo(cx, cy + dy * k); ctx.closePath();
    const cg = ctx.createLinearGradient(cx, cy, cx + dx * k, cy + dy * k);
    cg.addColorStop(0, "#eef1f3"); cg.addColorStop(0.6, "#a6acb2"); cg.addColorStop(1, "#6b7177");
    ctx.fillStyle = cg; ctx.fill(); ctx.lineWidth = 1 * s; ctx.strokeStyle = "rgba(30,33,37,0.8)"; ctx.stroke();
    percin(ctx, cx + dx * k * 0.72, cy + dy * kk * 0.5, 2.6 * s);
    percin(ctx, cx + dx * kk * 0.5, cy + dy * k * 0.72, 2.6 * s);
  }
  // alt çerçevede gravür süsü (yazı yok)
  const ox = x + w / 2, oy = y + h - 13 * s;
  ctx.strokeStyle = "rgba(200,205,210,0.55)"; ctx.lineWidth = 1 * s;
  ctx.beginPath(); ctx.moveTo(ox - 6 * s, oy); ctx.lineTo(ox, oy - 5 * s); ctx.lineTo(ox + 6 * s, oy); ctx.lineTo(ox, oy + 5 * s); ctx.closePath(); ctx.stroke();
  for (const d of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(ox + d * 10 * s, oy);
    ctx.bezierCurveTo(ox + d * 30 * s, oy - 7 * s, ox + d * 45 * s, oy + 6 * s, ox + d * 62 * s, oy - 1 * s);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(ox + d * 66 * s, oy - 2 * s, 3 * s, 0, Math.PI * 2); ctx.stroke();
  }
  // klavye gövdesi (perspektif yamuk)
  const yb = y + h, yf = yb + derinlik, e = tasma;
  ctx.beginPath(); ctx.moveTo(x + 6 * s, yb); ctx.lineTo(x + w - 6 * s, yb); ctx.lineTo(x + w + e, yf); ctx.lineTo(x - e, yf); ctx.closePath();
  g = ctx.createLinearGradient(0, yb, 0, yf); g.addColorStop(0, "#2a2d32"); g.addColorStop(1, "#4a4f55");
  ctx.fillStyle = g; ctx.fill();
  const satirX = (t) => [x + 6 * s + (-e - 6 * s) * t, x + w - 6 * s + (e + 6 * s) * t];
  if (derinlik > 12) {
    for (let r = 0; r < 4; r++) {
      const t0 = 0.10 + r * 0.13, t1 = t0 + 0.10;
      const [a0, b0] = satirX(t0), [a1, b1] = satirX(t1);
      const n = 14;
      for (let i = 0; i < n; i++) {
        const u0 = 0.08 + i * 0.84 / n + 0.006, u1 = 0.08 + (i + 1) * 0.84 / n - 0.006;
        ctx.beginPath();
        ctx.moveTo(a0 + (b0 - a0) * u0, yb + derinlik * t0); ctx.lineTo(a0 + (b0 - a0) * u1, yb + derinlik * t0);
        ctx.lineTo(a1 + (b1 - a1) * u1, yb + derinlik * t1); ctx.lineTo(a1 + (b1 - a1) * u0, yb + derinlik * t1); ctx.closePath();
        ctx.fillStyle = "#16181b"; ctx.fill();
      }
    }
    const t0 = 0.68, t1 = 0.92, [a0, b0] = satirX(t0), [a1, b1] = satirX(t1);
    ctx.beginPath();
    ctx.moveTo(a0 + (b0 - a0) * 0.36, yb + derinlik * t0); ctx.lineTo(a0 + (b0 - a0) * 0.64, yb + derinlik * t0);
    ctx.lineTo(a1 + (b1 - a1) * 0.64, yb + derinlik * t1); ctx.lineTo(a1 + (b1 - a1) * 0.36, yb + derinlik * t1); ctx.closePath();
    ctx.fillStyle = "rgba(20,22,25,0.55)"; ctx.fill();
  }
  // ön yüz: gümüş kenar
  const yuz = Math.max(3, 10 * s);
  ctx.beginPath(); ctx.moveTo(x - e, yf); ctx.lineTo(x + w + e, yf); ctx.lineTo(x + w + e - 2 * s, yf + yuz); ctx.lineTo(x - e + 2 * s, yf + yuz); ctx.closePath();
  g = ctx.createLinearGradient(0, yf, 0, yf + yuz); g.addColorStop(0, "#dfe3e6"); g.addColorStop(1, "#7d838a");
  ctx.fillStyle = g; ctx.fill();
  return { sx, sy, sw, sh, h };
}


// ---------- EJDERHA MİĞFERİ (v2) — kafatasının tepesine, kaş dikenlerinin arasına oturur ----------
// yerel koordinat: madalyon merkezi (0,0); +y burna doğru, -y başın arkasına doğru
function bronzPercin(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, "#e9c88f"); g.addColorStop(0.55, "#9a7442"); g.addColorStop(1, "#3b2a18");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function bronzKenar(ctx, yol, kalin) {
  ctx.lineWidth = kalin + 2.5; ctx.strokeStyle = "#1c1612"; ctx.stroke(yol);
  ctx.lineWidth = kalin; ctx.strokeStyle = "#8f6d42"; ctx.stroke(yol);
  ctx.lineWidth = kalin * 0.35; ctx.strokeStyle = "rgba(226,190,130,0.75)"; ctx.stroke(yol);
}
function kararmisCelik(ctx, yol, cx, cy, r) {
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.45, r * 0.05, cx, cy, r);
  g.addColorStop(0, "#7a746d"); g.addColorStop(0.35, "#4d4844"); g.addColorStop(0.75, "#2c2927"); g.addColorStop(1, "#1b1918");
  ctx.fillStyle = g; ctx.fill(yol);
}
function kafalik2(ctx, logo) {
  // arkadaki iki katman (lame)
  for (const [yT, yB, gen] of [[-98, -76, 62], [-82, -58, 80]]) {
    const l = new Path2D();
    l.moveTo(-gen, yT + 20); l.quadraticCurveTo(0, yT - 20, gen, yT + 20);
    l.lineTo(gen + 4, yB + 20); l.quadraticCurveTo(0, yB - 20, -gen - 4, yB + 20); l.closePath();
    kararmisCelik(ctx, l, 0, yT, gen * 1.2);
    bronzKenar(ctx, l, 2.4);
    for (const d of [-1, 1]) bronzPercin(ctx, d * gen * 0.6, (yT + yB) / 2 + 4, 2.4);
  }
  // ana plaka
  const yol = new Path2D();
  yol.moveTo(-92, -20); yol.quadraticCurveTo(-80, -60, 0, -64); yol.quadraticCurveTo(80, -60, 92, -20);
  yol.quadraticCurveTo(97, 22, 70, 46); yol.lineTo(42, 40); yol.quadraticCurveTo(18, 44, 0, 68);
  yol.quadraticCurveTo(-18, 44, -42, 40); yol.lineTo(-70, 46); yol.quadraticCurveTo(-97, 22, -92, -20); yol.closePath();
  kararmisCelik(ctx, yol, 0, -6, 104);
  // aşınma: küçük çizikler ve pas lekeleri
  ctx.save(); ctx.clip(yol);
  let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    const x = (rnd() - 0.5) * 190, y = (rnd() - 0.5) * 130, u = 3 + rnd() * 10, a = rnd() * Math.PI;
    ctx.strokeStyle = `rgba(170,160,148,${0.08 + rnd() * 0.12})`; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * u, y + Math.sin(a) * u); ctx.stroke();
  }
  for (let i = 0; i < 18; i++) {
    const x = (rnd() - 0.5) * 180, y = (rnd() - 0.5) * 120;
    ctx.fillStyle = `rgba(110,72,40,${0.10 + rnd() * 0.12})`; ctx.beginPath(); ctx.arc(x, y, 2 + rnd() * 5, 0, Math.PI * 2); ctx.fill();
  }
  // orta sırt (madalyonun önünde ve arkasında)
  for (const [y0, y1] of [[-62, -36], [36, 64]]) {
    ctx.strokeStyle = "rgba(190,180,168,0.55)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(0, y1); ctx.stroke();
    ctx.strokeStyle = "rgba(10,8,8,0.6)"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(2, y0); ctx.lineTo(2, y1); ctx.stroke();
  }
  // bronz kakma kıvrımlar
  ctx.strokeStyle = "rgba(196,154,92,0.55)"; ctx.lineWidth = 1.3;
  for (const d of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(d * 38, -4); ctx.bezierCurveTo(d * 52, -26, d * 72, -20, d * 70, -4); ctx.bezierCurveTo(d * 68, 8, d * 56, 6, d * 58, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d * 36, 14); ctx.bezierCurveTo(d * 48, 30, d * 62, 30, d * 66, 20); ctx.stroke();
  }
  ctx.restore();
  bronzKenar(ctx, yol, 3.6);
  for (const [x, y] of [[-84, -22], [-68, -46], [-38, -56], [38, -56], [68, -46], [84, -22], [82, 14], [-82, 14], [60, 36], [-60, 36], [24, 46], [-24, 46]]) bronzPercin(ctx, x, y, 2.6);
  // madalyon: bronz halka + ORİJİNAL LOGO
  let g = ctx.createRadialGradient(-8, -10, 3, 0, 0, 34);
  g.addColorStop(0, "#e6c28a"); g.addColorStop(0.6, "#8c6a3f"); g.addColorStop(1, "#3a2918");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 33, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#1c1612"; ctx.lineWidth = 1.5; ctx.stroke();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; bronzPercin(ctx, Math.cos(a) * 29, Math.sin(a) * 29, 1.8); }
  ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 24.5, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(logo, -23, -23, 46, 46);
  ctx.restore();
  ctx.strokeStyle = "rgba(28,22,18,0.9)"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.stroke();
  return yol;
}

// ---------- EJDERHA MİĞFERİ (v3) — eskitilmiş, başın orta çizgisinde, siyah zeminli logo ----------
function kafalik3(ctx, logoKoyu) {
  let r = 11; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  const matBronz = (y0, y1) => { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, "#8a7350"); g.addColorStop(1, "#4f3d26"); return g; };
  const kenar = (yol, k) => {
    ctx.lineWidth = k + 2.5; ctx.strokeStyle = "#17120e"; ctx.stroke(yol);
    ctx.lineWidth = k; ctx.strokeStyle = "#6f5634"; ctx.stroke(yol);
    ctx.lineWidth = k * 0.3; ctx.strokeStyle = "rgba(190,160,110,0.45)"; ctx.stroke(yol);
  };
  const percinE = (x, y, rr) => { bronzPercin(ctx, x, y, rr); ctx.fillStyle = "rgba(60,90,70,0.35)"; ctx.beginPath(); ctx.arc(x + rr * 0.3, y + rr * 0.3, rr * 0.6, 0, Math.PI * 2); ctx.fill(); };
  // arka katmanlar
  for (const [yT, yB, gen] of [[-98, -76, 62], [-82, -58, 80]]) {
    const l = new Path2D();
    l.moveTo(-gen, yT + 20); l.quadraticCurveTo(0, yT - 20, gen, yT + 20);
    l.lineTo(gen + 4, yB + 20); l.quadraticCurveTo(0, yB - 20, -gen - 4, yB + 20); l.closePath();
    kararmisCelik(ctx, l, 0, yT, gen * 1.2);
    ctx.fillStyle = "rgba(20,16,12,0.25)"; ctx.fill(l);
    kenar(l, 2.2);
    for (const d of [-1, 1]) percinE(d * gen * 0.6, (yT + yB) / 2 + 4, 2.3);
  }
  // ana plaka
  const yol = new Path2D();
  yol.moveTo(-92, -20); yol.quadraticCurveTo(-80, -60, 0, -64); yol.quadraticCurveTo(80, -60, 92, -20);
  yol.quadraticCurveTo(97, 22, 70, 46); yol.lineTo(42, 40); yol.quadraticCurveTo(18, 44, 0, 68);
  yol.quadraticCurveTo(-18, 44, -42, 40); yol.lineTo(-70, 46); yol.quadraticCurveTo(-97, 22, -92, -20); yol.closePath();
  kararmisCelik(ctx, yol, 0, -6, 104);
  ctx.save(); ctx.clip(yol);
  // kenarlarda kir ve is
  let g = ctx.createRadialGradient(0, -4, 40, 0, -4, 110); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(25,18,12,0.55)");
  ctx.fillStyle = g; ctx.fillRect(-110, -80, 220, 160);
  // pas lekeleri (büyük, yumuşak)
  ctx.filter = "blur(3px)";
  for (let i = 0; i < 16; i++) {
    const x = (rnd() - 0.5) * 180, y = (rnd() - 0.5) * 110;
    ctx.fillStyle = `rgba(${110 + rnd() * 30},${58 + rnd() * 20},30,${0.18 + rnd() * 0.18})`;
    ctx.beginPath(); ctx.ellipse(x, y, 4 + rnd() * 12, 3 + rnd() * 7, rnd() * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.filter = "none";
  // ezikler (koyu + açık yay çifti)
  for (let i = 0; i < 6; i++) {
    const x = (rnd() - 0.5) * 150, y = (rnd() - 0.5) * 90, rr = 4 + rnd() * 6;
    if (Math.hypot(x, y) < 44) continue;
    ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(10,8,6,0.55)"; ctx.beginPath(); ctx.arc(x, y, rr, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.strokeStyle = "rgba(200,190,175,0.35)"; ctx.beginPath(); ctx.arc(x, y, rr, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  }
  // derin çizikler ve kılcal çizikler
  for (let i = 0; i < 140; i++) {
    const x = (rnd() - 0.5) * 190, y = (rnd() - 0.5) * 130, u = 2 + rnd() * (i < 12 ? 30 : 9), a = -0.4 + rnd() * 0.8 + (rnd() < 0.3 ? 1.6 : 0);
    ctx.strokeStyle = i < 12 ? "rgba(205,195,180,0.30)" : `rgba(175,165,150,${0.06 + rnd() * 0.14})`; ctx.lineWidth = i < 12 ? 1.1 : 0.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * u, y + Math.sin(a) * u); ctx.stroke();
  }
  // orta sırt
  for (const [y0, y1] of [[-62, -42], [42, 64]]) {
    ctx.strokeStyle = "rgba(170,160,145,0.45)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(0, y1); ctx.stroke();
    ctx.strokeStyle = "rgba(10,8,8,0.6)"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(2, y0); ctx.lineTo(2, y1); ctx.stroke();
  }
  // solmuş bronz kakma
  ctx.strokeStyle = "rgba(160,128,80,0.40)"; ctx.lineWidth = 1.2;
  for (const d of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(d * 46, -4); ctx.bezierCurveTo(d * 56, -26, d * 76, -20, d * 74, -4); ctx.bezierCurveTo(d * 72, 8, d * 60, 6, d * 62, -2); ctx.stroke();
  }
  ctx.restore();
  kenar(yol, 3.4);
  // kenar çentikleri
  // kenar çentikleri: bronzun aşınıp çeliğin göründüğü yerler
  for (const [x, y, rr] of [[-91, -6, 3.2], [55, -57, 2.8], [86, 30, 3], [-30, 49, 2.4], [-62, -50, 2.6]]) {
    ctx.fillStyle = "#6c6660"; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(20,16,12,0.6)"; ctx.beginPath(); ctx.arc(x + rr * 0.3, y + rr * 0.3, rr * 0.55, 0, Math.PI * 2); ctx.fill();
  }
  for (const [x, y] of [[-84, -22], [-68, -46], [-38, -56], [38, -56], [68, -46], [84, -22], [82, 14], [-82, 14], [60, 36], [-60, 36], [24, 46], [-24, 46]]) percinE(x, y, 2.5);
  // madalyon: mat bronz halka + siyah mine + logo (sitenin koyu tema logosu)
  ctx.fillStyle = matBronz(-40, 40); ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#15100c"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.clip();
  for (let i = 0; i < 14; i++) { const a = rnd() * Math.PI * 2, rr = 33 + rnd() * 6; ctx.fillStyle = `rgba(70,110,90,${0.15 + rnd() * 0.2})`; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.5 + rnd() * 3, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; percinE(Math.cos(a) * 36, Math.sin(a) * 36, 1.8); }
  ctx.fillStyle = "#0b0b0d"; ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.drawImage(logoKoyu, -30, -30, 60, 60);
  // minenin üstünde hafif cam parlaması
  g = ctx.createLinearGradient(-30, -30, 20, 20); g.addColorStop(0, "rgba(255,255,255,0.10)"); g.addColorStop(0.5, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.fill();
  return yol;
}

// ---------- EJDERHA KAFALIĞI v1 (chanfron, reddedildi)  — yerel koordinat: tepe ortası (0,0), aşağı doğru ----------
function kafalik(ctx, logo) {
  // deri kayışlar (plakanın arkasında)
  ctx.lineCap = "round";
  for (const [a, b] of [[[-48, 30], [-98, -62]], [[48, 30], [104, -44]]]) {
    ctx.strokeStyle = "#4e301c"; ctx.lineWidth = 13; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.strokeStyle = "rgba(220,185,140,0.35)"; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(a[0], a[1] - 4); ctx.lineTo(b[0], b[1] - 4); ctx.stroke(); ctx.setLineDash([]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    ctx.strokeStyle = "#c2c7cc"; ctx.lineWidth = 2.5; ctx.strokeRect(mx - 6, my - 8, 12, 16);
  }
  ctx.lineCap = "butt";
  const yol = new Path2D();
  yol.moveTo(-54, 20); yol.quadraticCurveTo(-48, -4, 0, -14); yol.quadraticCurveTo(48, -4, 54, 20);
  yol.lineTo(42, 140); yol.quadraticCurveTo(36, 176, 0, 182); yol.quadraticCurveTo(-36, 176, -42, 140); yol.closePath();
  // tepe sivrisi
  const sivri = new Path2D(); sivri.moveTo(-8, -11); sivri.lineTo(0, -40); sivri.lineTo(8, -11); sivri.closePath();
  let g = ctx.createLinearGradient(-8, 0, 8, 0); g.addColorStop(0, "#7a8087"); g.addColorStop(0.5, "#eef1f3"); g.addColorStop(1, "#5e646a");
  ctx.fillStyle = g; ctx.fill(sivri); ctx.strokeStyle = "#3a3f45"; ctx.lineWidth = 1; ctx.stroke(sivri);
  // plaka gövdesi: gümüş çelik
  g = ctx.createLinearGradient(-54, 0, 54, 0);
  g.addColorStop(0, "#5f656c"); g.addColorStop(0.3, "#b6bcc2"); g.addColorStop(0.47, "#eef1f3"); g.addColorStop(0.53, "#dde1e4");
  g.addColorStop(0.72, "#a4aab0"); g.addColorStop(1, "#555b62");
  ctx.fillStyle = g; ctx.fill(yol);
  g = ctx.createLinearGradient(0, -14, 0, 182); g.addColorStop(0, "rgba(255,255,255,0.10)"); g.addColorStop(1, "rgba(0,0,0,0.28)");
  ctx.fillStyle = g; ctx.fill(yol);
  // kenar: kıvrık rulo kenar
  ctx.lineWidth = 6; ctx.strokeStyle = "#3c4248"; ctx.stroke(yol);
  ctx.lineWidth = 2.6; ctx.strokeStyle = "#e3e7ea"; ctx.stroke(yol);
  // orta sırt
  ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0, 104); ctx.lineTo(0, 172); ctx.stroke();
  ctx.strokeStyle = "rgba(40,44,48,0.55)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(2, 104); ctx.lineTo(2, 172); ctx.stroke();
  // gravür kıvrımları (şövalyenin göğüs zırhındaki desene benzer)
  ctx.strokeStyle = "rgba(45,50,56,0.55)"; ctx.lineWidth = 1;
  for (const d of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(d * 4, 112); ctx.bezierCurveTo(d * 26, 108, d * 30, 128, d * 16, 132); ctx.bezierCurveTo(d * 6, 135, d * 8, 124, d * 15, 124); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d * 4, 146); ctx.bezierCurveTo(d * 22, 142, d * 26, 160, d * 13, 163); ctx.bezierCurveTo(d * 5, 165, d * 6, 156, d * 12, 156); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d * 10, 6); ctx.bezierCurveTo(d * 30, 4, d * 42, 14, d * 44, 26); ctx.stroke();
  }
  // kenar perçinleri
  for (const d of [-1, 1]) for (let i = 0; i < 6; i++) {
    const t = i / 5; percin(ctx, d * (47 - 11 * t), 30 + 112 * t, 2.8);
  }
  // madalyon: çelik halka + perçinler + beyaz mine zemin + ORİJİNAL LOGO
  const mx = 0, my = 64;
  g = ctx.createRadialGradient(mx - 8, my - 10, 4, mx, my, 38);
  g.addColorStop(0, "#f2f4f6"); g.addColorStop(0.7, "#9aa0a6"); g.addColorStop(1, "#4b5157");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 37, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#353a40"; ctx.lineWidth = 1.5; ctx.stroke();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; percin(ctx, mx + Math.cos(a) * 33, my + Math.sin(a) * 33, 1.9); }
  ctx.fillStyle = "#f6f7f8"; ctx.beginPath(); ctx.arc(mx, my, 29, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(mx, my, 28.5, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(logo, mx - 26, my - 26, 52, 52);
  ctx.restore();
  ctx.strokeStyle = "rgba(40,44,48,0.8)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(mx, my, 29, 0, Math.PI * 2); ctx.stroke();
  return yol;
}

function yazi(ctx, m, x, y, boy, agirlik, renk, hiza) {
  ctx.font = `${agirlik} ${boy}px Montserrat`; ctx.fillStyle = renk; ctx.textAlign = hiza || "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(m, x, y);
}
