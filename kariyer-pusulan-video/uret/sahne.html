<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kare çizici</title>
<!-- Elle açmak için değil: ciz.js bu sayfayı başsız Chromium'da açıp kare kare çizdirir. -->
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/dancing-script/700.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>{
  // Onaylanan varsayılanlar (KARARLAR.md): keskin gradyan yazı, yeni laptop, sade yüz.
  // Eski hâller için: --yazi eski, --laptop eski, --yuz yok
  const q = new URLSearchParams(location.search);
  window.KP.insanModu = q.get("insan") || "siluet";
  window.KP.SECENEK = { yazi: "keskin", laptop: "yeni", yuz: "sade", ...Object.fromEntries(q) };
  window.KP.YAZI.stil = window.KP.SECENEK.yazi;
}</script>
<script src="figur.js"></script>
<script src="ikon.js"></script>
<script src="figur2.js"></script>
<script src="isik-insan.js"></script>
<script src="karakter.js"></script>
<script src="kadro.js"></script>
<script src="tasarim.js"></script>
<script src="tasarim2.js"></script>
<script src="kesit-01.js"></script>
<script src="kesit-02.js"></script>
<script src="kesit-03.js"></script>
<script src="kesit-04.js"></script>
<script src="kesit-05.js"></script>
<script src="kesit-06.js"></script>
<script src="kesit-07.js"></script>
<script src="kesit-08.js"></script>
<script>
  const ctx = document.getElementById("c").getContext("2d");
  window.hazir = (async () => {
    const ornek = "2.500 kişi pusulasını buldu Sıradaki fırsatı İĞŞÇÖÜ ığşçöü";
    await Promise.all([500, 600, 700, 800, 900].map((w) => document.fonts.load(`${w} 40px Montserrat`, ornek)));
    await document.fonts.load("700 80px 'Dancing Script'", "İyi ki varsınız");
    window.LOGO = new Image();
    window.LOGO.src = "../referans/logo-orijinal.png";
    await window.LOGO.decode();
    return true;
  })();
  // Tek kare çizer ve PNG'yi base64 olarak döndürür.
  window.kare = (kesit, no) => {
    const k = window.KESITLER[kesit];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
    ctx.clearRect(0, 0, 1080, 1920);
    k.ciz(ctx, no / window.KP.FPS, no);
    return document.getElementById("c").toDataURL("image/png").split(",")[1];
  };
  window.sure = (kesit) => window.KESITLER[kesit].sure;
</script>
</body>
</html>
